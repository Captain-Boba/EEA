[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "european-electricity-atlas"
version = "0.1.0"
description = "Traceable data core for comparing European electricity systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["playwright>=1.62,<2"]

[project.scripts]
eea = "electricity_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
